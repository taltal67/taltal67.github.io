<h1>Halo apa kabar?</h1>
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>For You ❤️</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, #641f35 0%, transparent 40%),
        linear-gradient(135deg, #240b14, #4a1024, #210811);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 600px;
      text-align: center;
      padding: 45px 30px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 25px;
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }

    .heart {
      font-size: 55px;
      margin-bottom: 15px;
      animation: heartbeat 1.5s infinite;
    }

    h1 {
      font-size: 38px;
      margin-bottom: 12px;
      color: #fff;
    }

    .subtitle {
      color: #e8b8c5;
      font-size: 16px;
      line-height: 1.7;
      margin-bottom: 30px;
    }

    .message {
      background: rgba(0, 0, 0, 0.15);
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 28px;
      color: #f5dce3;
      line-height: 1.8;
      font-size: 15px;
    }

    .spotify {
      overflow: hidden;
      border-radius: 14px;
      margin-top: 10px;
    }

    .footer {
      margin-top: 25px;
      font-size: 12px;
      color: #b98291;
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.15);
      }
    }

    @media (max-width: 500px) {
      .container {
        padding: 35px 20px;
      }

      h1 {
        font-size: 30px;
      }

      .heart {
        font-size: 45px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="heart">❤️</div>

    <h1>For You</h1>

    <p class="subtitle">
      Ada sesuatu yang ingin aku sampaikan...
    </p>

    <div class="message">
      Mungkin aku nggak selalu pandai mengungkapkan
      apa yang aku rasakan.
      <br><br>
      Tapi semoga lewat halaman kecil ini,
      kamu bisa tahu kalau kamu punya tempat
      yang spesial di hati aku. ❤️
    </div>

    <div class="spotify">
      <iframe
        style="border-radius:12px"
        src="https://open.spotify.com/embed/track/5xCsdnbeg7yhVX2qlRaDUw"
        width="100%"
        height="152"
        frameborder="0"
        allowfullscreen=""
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        loading="lazy">
      </iframe>
    </div>

    <p class="footer">
      Made with ❤️
    </p>

  </main>

</body>
</html>
